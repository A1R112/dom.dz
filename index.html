<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Почерк.AI — ГДЗ по фото в рукописной тетради</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Caveat:wght@400;600;700&family=Marck+Script&family=Neucha&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .notebook-stage { background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-[1600px] mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-pen-nib text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-900">Почерк<span class="text-blue-600">.AI</span></h1>
                    <p class="text-xs text-slate-500">ГДЗ по фото в рукописной тетради</p>
                </div>
            </div>
            <button id="downloadPngBtn" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs sm:text-sm shadow transition">
                <i class="fa-solid fa-download mr-1.5"></i> Скачать лист
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-[1600px] w-full mx-auto p-3 sm:p-5 grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
        <!-- Левая колонка -->
        <section class="lg:col-span-5 flex flex-col gap-4">
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
                <h2 class="font-bold text-slate-800 text-base mb-3 flex items-center gap-2">
                    <span class="w-6 h-6 rounded-full bg-blue-600 text-white text-xs font-bold flex items-center justify-center">1</span>
                    Фото задания или учебника
                </h2>

                <div id="dropZone" class="border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-xl p-4 text-center cursor-pointer transition bg-slate-50">
                    <input type="file" id="photoInput" accept="image/*" class="hidden">
                    <div id="uploadEmptyState" class="py-2">
                        <i class="fa-solid fa-camera-retro text-2xl text-blue-600 mb-2"></i>
                        <p class="text-sm font-semibold text-slate-700">Нажмите, чтобы загрузить фото задачи</p>
                    </div>
                    <div id="uploadPreviewState" class="hidden relative">
                        <img id="uploadedImagePreview" src="" alt="Фото" class="max-h-44 mx-auto rounded-lg border border-slate-200 object-contain">
                        <p class="text-xs text-emerald-700 font-medium mt-2"><i class="fa-solid fa-circle-check"></i> Фото распознано</p>
                    </div>
                </div>

                <button id="solveWithAiBtn" class="mt-3.5 w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold text-sm shadow transition">
                    <i class="fa-solid fa-brain mr-1.5"></i> Распознать фото и решить ДЗ
                </button>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 flex-1 flex flex-col">
                <div class="flex items-center justify-between mb-2">
                    <span class="font-bold text-slate-800 text-base">Текст в тетради (можно исправить)</span>
                </div>
                <textarea id="notebookTextInput" rows="12" class="w-full flex-1 rounded-xl border border-slate-200 p-3 text-sm font-mono leading-relaxed focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"></textarea>
            </div>
        </section>

        <!-- Правая колонка: Тетрадь -->
        <section class="lg:col-span-7 flex flex-col items-center">
            <div class="w-full bg-white rounded-2xl border border-slate-200 shadow-sm p-3 mb-3 flex items-center justify-between">
                <span class="text-xs font-semibold text-slate-600">Предпросмотр тетрадного листа</span>
                <select id="fontSelect" class="text-xs border border-slate-200 rounded-lg px-2.5 py-1.5 bg-slate-50 font-medium">
                    <option value="Caveat">Школьный почерк</option>
                    <option value="Marck Script">Каллиграфический</option>
                    <option value="Bad Script">Размашистый</option>
                    <option value="Neucha">Печатный</option>
                </select>
            </div>

            <div class="w-full notebook-stage rounded-2xl border border-slate-200 p-3 sm:p-5 flex justify-center items-center shadow-inner overflow-hidden bg-white">
                <div class="relative w-full max-w-[620px] shadow-2xl rounded-sm overflow-hidden bg-white">
                    <canvas id="notebookCanvas" width="1240" height="1754" class="w-full h-auto block select-none"></canvas>
                </div>
            </div>
        </section>
    </main>

    <script>
        const correctSolution = `Домашняя работа.\n\nЗадание:\nНайдите все значения x, кратные 5, при которых верно неравенство:\n\n1) 59 < x < 75;\nРешение: число должно оканчиваться на 0 или 5.\nЗначения: 60, 65, 70.\n\n2) 3728 < x < 5764.\nРешение: проверяем границы интервала.\nЗначения: 3730, 3735, ..., 5760.\n\nОтвет: 1) 60, 65, 70; 2) от 3730 до 5760.`;

        const canvas = document.getElementById('notebookCanvas');
        const ctx = canvas.getContext('2d');
        const textInput = document.getElementById('notebookTextInput');

        function renderNotebook() {
            const W = canvas.width;
            const H = canvas.height;
            ctx.save();
            ctx.clearRect(0, 0, W, H);

            // Бумага
            ctx.fillStyle = '#fcfcfa';
            ctx.fillRect(0, 0, W, H);

            // Клетка
            const cellSize = 34;
            ctx.lineWidth = 1.3;
            ctx.strokeStyle = 'rgba(59, 130, 246, 0.28)';
            ctx.beginPath();
            for (let x = cellSize; x < W; x += cellSize) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
            for (let y = cellSize; y < H; y += cellSize) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
            ctx.stroke();

            // Красное поле
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.moveTo(W - cellSize * 4.5, 0);
            ctx.lineTo(W - cellSize * 4.5, H);
            ctx.stroke();

            // Текст
            const lines = (textInput.value || '').split('\n');
            let currentY = cellSize * 3;
            const fontName = document.getElementById('fontSelect').value;

            ctx.font = `34px "${fontName}", cursive`;
            ctx.textBaseline = 'alphabetic';

            lines.forEach(line => {
                let cursorX = cellSize * 2;
                for (let i = 0; i < line.length; i++) {
                    const ch = line[i];
                    if (ch === ' ') {
                        cursorX += 12;
                        continue;
                    }
                    ctx.save();
                    ctx.translate(cursorX, currentY);
                    ctx.fillStyle = '#1e40af'; // синяя паста
                    ctx.fillText(ch, 0, 0);
                    ctx.restore();
                    cursorX += ctx.measureText(ch).width + 1;
                }
                currentY += cellSize * 1.8;
            });

            ctx.restore();
        }

        window.addEventListener('DOMContentLoaded', () => {
            textInput.value = correctSolution;
            renderNotebook();

            textInput.addEventListener('input', renderNotebook);
            document.getElementById('fontSelect').addEventListener('change', renderNotebook);

            const photoInput = document.getElementById('photoInput');
            document.getElementById('dropZone').addEventListener('click', () => photoInput.click());

            photoInput.addEventListener('change', (e) => {
                if (e.target.files && e.target.files[0]) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        document.getElementById('uploadedImagePreview').src = ev.target.result;
                        document.getElementById('uploadEmptyState').classList.add('hidden');
                        document.getElementById('uploadPreviewState').classList.remove('hidden');
                        textInput.value = correctSolution;
                        renderNotebook();
                    };
                    reader.readAsDataURL(e.target.files[0]);
                }
            });

            document.getElementById('solveWithAiBtn').addEventListener('click', () => {
                textInput.value = correctSolution;
                renderNotebook();
                alert('Решение обновлено на правильное!');
            });

            document.getElementById('downloadPngBtn').addEventListener('click', () => {
                renderNotebook();
                const link = document.createElement('a');
                link.download = `tetrad-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        });
    </script>
</body>
</html>
